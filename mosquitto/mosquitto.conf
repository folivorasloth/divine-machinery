# Mosquitto do Divine Machinery.
# ATENÇÃO: sem autenticação — só use dentro da rede local.

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# MQTT normal (Python, mosquitto_sub/pub)
listener 1883
allow_anonymous true

# MQTT sobre WebSocket, para as futuras telas no navegador
listener 9001
protocol websockets
